{% extends "base.html" %}
{% block title %}Sign in · pipeyard{% endblock %}
{% block main %}
<form class="card login" method="post" action="/login?next={{ next | urlencode }}">
  <h1>Sign in</h1>
  {% if error %}<p class="status failed">{{ error }}</p>{% endif %}
  <label for="username">Email</label><input id="username" name="username" autocomplete="username" required>
  <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
  <button>Sign in</button>
</form>
{% endblock %}
