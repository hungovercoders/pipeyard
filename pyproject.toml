[project]
name = "pipeyard"
version = "0.1.0"
description = "Bring-your-own-container data pipelines: Parquet in S3, DuckDB queries, small web UI."
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35",
    "duckdb>=1.3",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "pyjwt[crypto]>=2.9",
    "pyyaml>=6.0",
    "uvicorn>=0.32",
    "websockets>=14",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]
infra = ["aws-cdk-lib>=2.170", "constructs>=10.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeyard"]

[tool.uv]
default-groups = ["dev", "infra"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]


[tool.pytest.ini_options]
testpaths = ["tests"]
