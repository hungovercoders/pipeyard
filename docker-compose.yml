# Local AWS: moto server, an open-source emulator of the AWS APIs, used here for S3.
# The control plane runs on the host (`task up`) and talks to it on localhost:4566; run
# containers join this project's default network (pipeyard_default) and use
# http://aws:5000. State is in memory: restarting the emulator starts from an empty bucket.
name: pipeyard
services:
  aws:
    image: ${AWS_EMULATOR_IMAGE:-motoserver/moto:5.1.22}
    ports:
      - "4566:5000"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:5000/moto-api/data.json"]
      interval: 2s
      timeout: 2s
      retries: 30
